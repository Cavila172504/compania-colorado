<div class="flex h-screen w-screen overflow-hidden bg-slate-50 text-slate-800 font-sans">
  <!-- Sidebar Navigation - Con Toggle para no estar fijo -->
  <aside *ngIf="authService.isLoggedIn()" [class.w-0]="sidebarCollapsed" [class.w-72]="!sidebarCollapsed"
    [class.min-w-[18rem]]="!sidebarCollapsed"
    class="bg-white border-r border-slate-200 flex flex-col shadow-sm z-20 overflow-hidden relative transition-all duration-300 ease-in-out">

    <!-- Header / Logo -->
    <div class="relative p-4 bg-white border-b border-slate-100 flex flex-col items-center gap-2 text-center">
      <img src="img/logo.png" alt="Colorado Express" class="w-20 h-20 object-contain">
      <div class="space-y-0.5">
        <h1 class="text-base font-black leading-tight tracking-tighter text-slate-900 m-0 uppercase">COLORADO EXPRESS
        </h1>
        <p class="text-[0.6rem] font-black text-blue-600 uppercase tracking-[0.2em]">S.A. Sto. Domingo</p>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-4 flex flex-col gap-2 overflow-y-auto relative custom-scrollbar bg-slate-50/20">
      <div class="px-2 mb-2 text-[0.7rem] font-bold text-slate-500 tracking-wider uppercase">
        Principal
      </div>

      <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">Dashboard General</span>
        <div class="active-indicator"></div>
      </a>

      <a routerLink="/vehiculos" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">🚍</span>
        <span class="nav-text">Flota de Vehículos</span>
        <div class="active-indicator"></div>
      </a>

      <a routerLink="/conductores" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">👔</span>
        <span class="nav-text">Personal Socios</span>
        <div class="active-indicator"></div>
      </a>

      <a routerLink="/rutas" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">📍</span>
        <span class="nav-text">Rutas y Servicios</span>
        <div class="active-indicator"></div>
      </a>

      <a routerLink="/creditos-socio" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">💳</span>
        <span class="nav-text">Crédito Socio</span>
        <div class="active-indicator"></div>
      </a>

      <div class="mt-8 mb-2 px-2 text-[0.7rem] font-bold text-slate-500 tracking-wider uppercase">
        Administración
      </div>

      <a routerLink="/flujo-caja" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">📈</span>
        <span class="nav-text">Flujo de Caja</span>
        <div class="active-indicator"></div>
      </a>

      <a routerLink="/flujo-consolidado" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">📊</span>
        <span class="nav-text">Consolidado Total</span>
        <div class="active-indicator"></div>
      </a>

      <a routerLink="/gastos-admin" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">🧾</span>
        <span class="nav-text">Gastos Administrativos</span>
        <div class="active-indicator"></div>
      </a>

      <a routerLink="/resumen-consolidado" routerLinkActive="nav-active" class="nav-item group">
        <span class="nav-icon">📋</span>
        <span class="nav-text">Resumen Anual</span>
        <div class="active-indicator"></div>
      </a>
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t border-slate-200 bg-white">
      <button (click)="logout()"
        class="w-full p-3 bg-slate-50 hover:bg-red-50 border-2 border-slate-200 hover:border-red-200 text-slate-600 hover:text-red-600 rounded-xl flex items-center justify-center gap-2 transition-all font-black text-sm tracking-wide shadow-sm group whitespace-nowrap overflow-hidden">
        <span class="group-hover:scale-110 transition-transform">🚪</span>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Content Area -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
    <!-- Top Bar with Sidebar Toggle -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center px-6 gap-4 z-10 shadow-sm shrink-0">
      <button (click)="toggleSidebar()"
        class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-500 transition-colors">
        <span class="text-2xl">{{ sidebarCollapsed ? '➡️' : '⬅️' }}</span>
      </button>

      <div class="flex-1"></div>

      <div class="flex items-center gap-3">
        <span class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Sistema Activo</span>
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 bg-slate-50 relative">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
